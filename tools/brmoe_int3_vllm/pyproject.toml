[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brmoe-int3-vllm"
version = "0.1.0"
description = "BR-MoE 3-bit (int3) quantization plugin for vLLM"
requires-python = ">=3.9"
# vllm / torch / triton 由运行环境提供，这里不写死版本，避免 pip 去动环境
dependencies = []

[project.entry-points."vllm.general_plugins"]
register_brmoe_int3 = "brmoe_int3_vllm:register"

[tool.setuptools]
packages = ["brmoe_int3_vllm"]
package-dir = {"brmoe_int3_vllm" = "."}
